[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-transformer-learning"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "Pillow",
    "tqdm",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]
